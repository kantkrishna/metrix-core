      summary: Inspect BullMQ notification dispatch logs
      x-required-permission: notifications:view
      x-rls-scope: TENANT_OR_SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - { name: deliveryStatus, in: query, schema: { $ref: "#/components/schemas/DeliveryStatus" } }
      responses:
        "200": { description: Deliveries., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationDeliveryPageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/deliveries/{deliveryId}/retry:
    post:
      tags: [J10 · Notifications]
      operationId: retryNotificationDelivery
      summary: Trigger 1-click BullMQ retry for a failed or bounced notification delivery
      x-required-permission: notifications:manage
      x-rls-scope: TENANT_OR_SUPER_ADMIN
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/DeliveryIdPath" }]
      responses:
        "202": { description: Retry queued., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/notifications/preferences:
    get:
      tags: [J10 · Notifications]
      operationId: getMyNotificationPreferences
      summary: Load personal administrator category toggles, daily digest schedule & quiet hours
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }]
      responses:
        "200": { description: Preferences., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserNotificationPreference" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [J10 · Notifications]
      operationId: saveMyNotificationPreferences
      summary: Save personal administrator category toggles, digest time & mute schedule
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/UpsertUserNotificationPreference" } } } } } }
      responses:
        "200": { description: Saved., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/UserNotificationPreference" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/notifications/inbox:
    get:
      tags: [J10 · Notifications]
      operationId: getMyNotificationInbox
      summary: Fetch personal In-App notifications and unread count for Top Bar Bell popover
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        "200": { description: Inbox., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationInboxResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/notifications/inbox/{deliveryId}/read:
    patch:
      tags: [J10 · Notifications]
      operationId: markNotificationRead
      summary: Mark a personal In-App notification as read
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      parameters: [{ $ref: "#/components/parameters/DeliveryIdPath" }]
      responses:
        "200": { description: Marked read., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationDelivery" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Managed OIDC / OAuth 2.0 JWT Access Token validated via OIDC_JWKS_URI.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Scoped M2M API key verified against core.api_keys.key_hash.

  parameters:
    TenantIdHeader: { name: X-Tenant-Id, in: header, required: false, schema: { type: string, format: uuid } }
    OrgIdHeader: { name: X-Organization-Id, in: header, required: false, schema: { type: string, format: uuid } }
    TenantIdPath: { name: tenantId, in: path, required: true, schema: { type: string, format: uuid } }
    OrgIdPath: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    UserIdPath: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationIdPath: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    RoleIdPath: { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    MembershipIdPath: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    KeyIdPath: { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }
    WebhookIdPath: { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }
    AuditIdPath: { name: auditId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleIdPath: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    DeliveryIdPath: { name: deliveryId, in: path, required: true, schema: { type: string, format: uuid } }
    PageParam: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSizeParam: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    CursorParam: { name: cursor, in: query, schema: { type: string } }
    LimitParam: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    SearchParam: { name: search, in: query, schema: { type: string, maxLength: 120 } }

  responses:
    BadRequest: { description: Validation error (RFC 9457)., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    Unauthorized: { description: Missing or invalid OIDC JWT / API Key., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    Forbidden: { description: Insufficient RBAC permission or RLS block., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    NotFound: { description: Resource not found or invisible under caller RLS., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    Conflict: { description: Unique constraint or optimistic version conflict., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    Gone: { description: Expired invitation token., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    UnprocessableEntity: { description: Quota guardrail or downgrade hard blocker., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
    ServiceUnavailable: { description: Database or Redis unavailable., content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }

  schemas:
    DecimalAmount:
      type: string
      pattern: "^-?\d{1,12}\.\d{2}$"
    LocalWallTime:
      type: string
      pattern: "^([01]\d|2[0-3]):[0-5]\d:[0-5]\d$"
    ProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: ["string", "null"] }
        missingPermission: { type: ["string", "null"] }
        conflictField: { type: ["string", "null"] }
        hardBlockers: { type: array, items: { type: string } }
        fieldErrors: { type: object, additionalProperties: { type: array, items: { type: string } } }
    OffsetPaginationMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties: { page: { type: integer }, pageSize: { type: integer }, totalItems: { type: integer }, totalPages: { type: integer } }
    CursorPaginationMeta:
      type: object
      required: [limit, hasMore, nextCursor]
      properties: { limit: { type: integer }, hasMore: { type: boolean }, nextCursor: { type: ["string", "null"] } }
    AuditFields:
      type: object
      required: [createdBy, createdAt, updatedBy, updatedAt]
      properties:
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    CustomerType:
      type: string
      enum: [INDIVIDUAL_SMB, ENTERPRISE, CA_FIRM]
    TenantStatus:
      type: string
      enum: [TRIAL, ACTIVE, SUSPENDED, ARCHIVED]
    OrgType:
      type: string
      enum: [PRIMARY_BUSINESS, CORPORATE_HQ, SUBSIDIARY, BRANCH, CA_PRACTICE_HQ, CA_CLIENT_ORG]
    OrgStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED, ARCHIVED]
    UserStatus:
      type: string
      enum: [ACTIVE, INVITED, SUSPENDED, DEACTIVATED]
    UiThemeMode:
      type: string
      enum: [LIGHT, DARK, SYSTEM]
    OidcProviderType:
      type: string
      enum: [MANAGED_OIDC, ENTRA_ID_SSO, GOOGLE_WORKSPACE_SSO, CUSTOM_OIDC]
    OidcSyncStatus:
      type: string
      enum: [VERIFIED, PENDING_LINK, SYNC_ERROR]
    InvitationStatus:
      type: string
      enum: [SENT, ACCEPTED, EXPIRED, REVOKED]
    RoleScope:
      type: string
      enum: [PLATFORM, TENANT, ORGANIZATION]
    PermissionAction:
      type: string
      enum: [VIEW, CREATE, EDIT, DELETE, APPROVE, EXPORT, MANAGE]
    MembershipType:
      type: string
      enum: [INTERNAL_STAFF, TENANT_ADMIN, CA_PRACTICE_STAFF, EXTERNAL_CLIENT_USER]
    MembershipStatus:
      type: string
      enum: [ACTIVE, INVITED, SUSPENDED, EXPIRED, REVOKED]
    ServiceHealth:
      type: string
      enum: [OPERATIONAL, DEGRADED, OUTAGE]
    BillingCycle:
      type: string
      enum: [MONTHLY, ANNUAL]
    SubscriptionStatus:
      type: string
      enum: [TRIAL, ACTIVE, PAST_DUE, CANCELLED, SUSPENDED]
    ModuleSubscriptionStatus:
      type: string
      enum: [ACTIVE, TRIAL, NOT_SUBSCRIBED, UPGRADE_PENDING, SUSPENDED]
    SubscriptionChangeType:
      type: string
      enum: [UPGRADE, DOWNGRADE, MODULE_ADDED, MODULE_REMOVED, QUOTA_ADJUSTED]
    ChangeEffectiveTiming:
      type: string
      enum: [IMMEDIATE, END_OF_BILLING_CYCLE]
    SubscriptionChangeStatus:
      type: string
      enum: [PREVIEWED, SCHEDULED, APPLIED, CANCELLED]
    ConfigCategory:
      type: string
      enum: [GENERAL_LOCALIZATION, AUTH_OIDC_SSO, ISOLATION_QUOTAS, FEATURE_FLAGS]
    ApiKeyStatus:
      type: string
      enum: [ACTIVE, ROTATED, REVOKED]
    WebhookStatus:
      type: string
      enum: [ACTIVE, PAUSED, FAILING]
    AuditCategory:
      type: string
      enum: [AUTH, RBAC, SUBSCRIPTION, CONFIG, TENANCY, MODULE_DOMAIN]
    AuditOutcome:
      type: string
      enum: [SUCCESS, DENIED, FAILED]
    NotificationChannel:
      type: string
      enum: [IN_APP, EMAIL_SES, WEBHOOK]
    NotificationCategory:
      type: string
      enum: [SECURITY_ACCESS, TENANCY_ONBOARDING, BILLING_QUOTAS, SYSTEM_ALERTS]
    EmailRoutingMode:
      type: string
      enum: [OFF, ENABLED, IMMEDIATE]
    DeliveryCadence:
      type: string
      enum: [REAL_TIME, DAILY_DIGEST]
    DeliveryStatus:
      type: string
      enum: [QUEUED, DELIVERED, BOUNCED, RETRYING, FAILED]
    DatabaseHealthResponse:
      type: object
      required: [service, status, database, timestamp]
      properties:
        service: { type: string }
        status: { $ref: "#/components/schemas/ServiceHealth" }
        database:
          type: object
          required: [ok, currentRole, bypassRls, isSuperuser, serverVersion, enforcedRlsTables]
          properties: { ok: { type: boolean }, currentRole: { type: string }, bypassRls: { type: boolean }, isSuperuser: { type: boolean }, serverVersion: { type: string }, enforcedRlsTables: { type: integer } }
        timestamp: { type: string, format: date-time }
    SaasModuleSummary:
      type: object
      required: [code, displayName, description, apiVersion, healthStatus, includedFeatures, isCoreService, isActive]
      properties: { code: { type: string }, displayName: { type: string }, description: { type: string }, apiVersion: { type: string }, healthStatus: { $ref: "#/components/schemas/ServiceHealth" }, includedFeatures: { type: array, items: { type: string } }, isCoreService: { type: boolean }, isActive: { type: boolean } }
    UserUiPreferences:
      type: object
      required: [userId, uiNavPinned, uiThemeMode, unreadNotificationCount]
      properties: { userId: { type: string, format: uuid }, uiNavPinned: { type: boolean }, uiThemeMode: { $ref: "#/components/schemas/UiThemeMode" }, lastWorkspaceTenantId: { type: ["string", "null"], format: uuid }, unreadNotificationCount: { type: integer } }
    UpdateUserUiPreferencesRequest:
      type: object
      properties: { uiNavPinned: { type: boolean }, uiThemeMode: { $ref: "#/components/schemas/UiThemeMode" }, lastWorkspaceTenantId: { type: ["string", "null"], format: uuid } }
    ModuleContextFallback:
      type: object
      required: [fallbackApplied]
      properties:
        fallbackApplied: { type: boolean }
        requestedOrganizationId: { type: ["string", "null"], format: uuid }
        reason: { type: ["string", "null"] }
    AccessibleModuleItem:
      type: object
      required: [code, name, description, baseUrl, themeKey, apiVersion, status, healthStatus, isCoreService, permittedRoutes, effectivePermissions, featureFlags]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        baseUrl: { type: string }
        themeKey: { type: string }
        apiVersion: { type: string }
        status: { $ref: "#/components/schemas/ModuleSubscriptionStatus" }
        healthStatus: { $ref: "#/components/schemas/ServiceHealth" }
        isCoreService: { type: boolean }
        permittedRoutes: { type: array, items: { type: string } }
        effectivePermissions: { type: array, items: { type: string } }
        featureFlags: { type: object, additionalProperties: { type: boolean } }
    LockedModuleAddOn:
      type: object
      required: [code, name, description, status, manageSubscriptionUrl, upgradeRequired]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [NOT_SUBSCRIBED, SUSPENDED] }
        manageSubscriptionUrl: { type: string }
        upgradeRequired: { type: boolean }
    AccessibleModulesManifestResponse:
      type: object
      required: [tenantId, organizationId, organizationCode, organizationName, contextFallback, uiPreferences, modules, lockedAddOns, evaluatedAt]
      properties:
