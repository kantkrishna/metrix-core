# openapi/openapi-platform-core-v1.yaml
#
# Purpose: Defines the complete machine-readable OpenAPI 3.1.0 REST contract for all Platform Core journeys and the App Shell module manifest.
#
# Context: Authoritative API contract aligning delegated OIDC auth, X-Tenant-Id/X-Organization-Id RLS headers, RBAC scopes, Decimal.js amounts, and RFC 9457 errors.
#
# Implementation Specs: OpenAPI 3.1.0 (JSON Schema 2020-12) covering 64 paths, 75 unique operationIds (incl. GET /me/modules), and 30 PostgreSQL-aligned enums.

openapi: 3.1.0
info:
  title: Advantax Tax METRix — Platform Core Service API
  version: 1.1.0
  summary: Multi-tenant SaaS ERP administration, App Shell module manifest, RBAC, subscriptions, entitlements, audit orchestration & notifications.
  description: |
    Authoritative OpenAPI 3.1.0 contract for the **Advantax Tax METRix Platform Core Service** (64 paths, 75 operations, 30 PostgreSQL-aligned enums).
    Includes `GET /api/v1/core/me/modules` for dynamic App Shell module switching and route rendering.
    Enforces delegated OIDC authentication, database-level PostgreSQL FORCE RLS via `X-Tenant-Id` / `X-Organization-Id`,
    exact Decimal.js `NUMERIC(14,2)` amounts, and RFC 9457 `application/problem+json` errors.
  contact:
    name: Advantax Tax METRix Platform Architecture Team
    email: architecture@advantax-metrix.io
  license:
    name: Proprietary — Advantax Tax METRix
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.metrix-erp.cloud/api/v1/core
    description: Production API Gateway (v1)
  - url: https://staging-api.metrix-erp.cloud/api/v1/core
    description: Staging Environment (v1)
  - url: http://localhost:4001/api/v1/core
    description: Local NestJS Development Server (v1)
security:
  - oidcBearer: []
tags:
  - name: App Shell & Health
    description: Persisted navigation/theme preferences, dynamic App Shell module manifest (GET /me/modules), global search & DB health probes.
  - name: J1 · Auth & Dashboard
    description: Delegated OIDC sign-in discovery, token callback, workspace switcher, logout, and KPI dashboard.
  - name: J2 · Tenants & Organizations
    description: Multi-archetype tenant onboarding (SMB, Enterprise, CA Firm) and hierarchical organization trees.
  - name: J3 · Users & Invitations
    description: User directory, seat-quota preflight guard, OIDC activation invitations, and session revocation.
  - name: J4 · Roles & RBAC
    description: Four-service permission catalog, system default roles, custom role CRUD, and cloning.
  - name: J5 · Organization Memberships
    description: Scoped per-organization role assignments enforcing CA Firm multi-client isolation and effective access inspection.
  - name: J6 · Subscriptions & Entitlements
    description: Commercial plans, active tenant subscription summary, and per-organization module entitlement toggles.
  - name: J7 · Subscription Changes
    description: Decimal.js proration previews, downgrade hard/soft blocker evaluation, and typed confirmation execution.
  - name: J8 · Platform Configuration
    description: Optimistically versioned policies (OIDC/SSO, quotas, retention), service registry, API keys, and webhooks.
  - name: J9 · Centralized Audit Logs
    description: Immutable cross-service audit search, OpenTelemetry trace correlation, JSON diff inspection, and exports.
  - name: J10 · Notifications
    description: Channel providers, event routing matrix, BullMQ delivery retry logs, personal preferences, and inbox.

paths:
  /health/db:
    get:
      tags: [App Shell & Health]
      operationId: checkDatabaseHealth
      summary: Verify PostgreSQL connectivity, NOBYPASSRLS runtime role & FORCE RLS count
      security: []
      x-required-permission: public
      x-rls-scope: NONE
      responses:
        "200":
          description: Database connectivity and RLS posture status.
          content: { application/json: { schema: { $ref: "#/components/schemas/DatabaseHealthResponse" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /health/services:
    get:
      tags: [App Shell & Health]
      operationId: getServicesHealth
      summary: List live operational health for all registered METRix microservices
      x-required-permission: authenticated
      x-rls-scope: GLOBAL_CATALOG
      responses:
        "200":
          description: Registered microservice health summary.
          content:
            application/json:
              schema:
                type: object
                required: [operationalCount, totalCount, services]
                properties:
                  operationalCount: { type: integer }
                  totalCount: { type: integer }
                  services: { type: array, items: { $ref: "#/components/schemas/SaasModuleSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/preferences:
    get:
      tags: [App Shell & Health]
      operationId: getMyUiPreferences
      summary: Get persisted left navigation pin state, theme mode & unread bell count
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      responses:
        "200":
          description: Current user shell preferences.
          content: { application/json: { schema: { $ref: "#/components/schemas/UserUiPreferences" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [App Shell & Health]
      operationId: updateMyUiPreferences
      summary: Persist floating/pinned left navigation preference, theme mode, or last workspace
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateUserUiPreferencesRequest" } } }
      responses:
        "200":
          description: Updated user shell preferences.
          content: { application/json: { schema: { $ref: "#/components/schemas/UserUiPreferences" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/modules:
    get:
      tags: [App Shell & Health]
      operationId: getMyAccessibleModules
      summary: Resolve accessible METRix modules, permitted routes & persisted shell UI preferences for the active organization
      description: |
        Single authoritative App Shell manifest endpoint evaluated against `core.v_effective_user_org_permissions`,
        `core.tenant_module_subscriptions`, `core.organization_module_entitlements`, and `core.users` UI preferences.
        Unauthorized or unsubscribed modules are omitted for standard users; `lockedAddOns` is populated only when the
        caller holds `subscriptions:view` or `subscriptions:manage` and requests `includeLockedAddOns=true`.
        Backed by Redis caching keyed by `userId:tenantId:organizationId` with `Cache-Control: private, max-age=60` and `ETag`.
      x-required-permission: authenticated
      x-rls-scope: TENANT_AND_ORG
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/OrgIdHeader"
        - { name: organizationId, in: query, required: false, description: "Target organization UUID (takes precedence over X-Organization-Id; defaults to the user's primary or last active entitled organization).", schema: { type: string, format: uuid } }
        - { name: includeLockedAddOns, in: query, required: false, description: "Honored only for Tenant Owners and Platform Super Admins holding subscriptions:view or subscriptions:manage; ignored for standard staff.", schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Permission-filtered App Shell module manifest, resolved organization context, and persisted UI preferences.
          headers:
            Cache-Control:
              description: Private short-lived cache directive backed by Redis invalidation on role/membership/entitlement changes.
              schema: { type: string, example: "private, max-age=60" }
            ETag:
              description: Entity tag derived from user roles, memberships, and active entitlement state.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessibleModulesManifestResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /search:
    get:
      tags: [App Shell & Health]
      operationId: globalCommandSearch
      summary: Global command palette search (Cmd+K) scoped by caller RLS
      x-required-permission: authenticated
      x-rls-scope: TENANT_AND_ORG
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 10 } }
      responses:
        "200":
          description: Search results.
          content: { application/json: { schema: { $ref: "#/components/schemas/GlobalSearchResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/oidc/discover:
    post:
      tags: [J1 · Auth & Dashboard]
      operationId: discoverOidcProvider
      summary: Resolve tenant workspace slug or work email to delegated OIDC authorization URL
      security: []
      x-required-permission: public
      x-rls-scope: NONE
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OidcDiscoverRequest" } } }
      responses:
        "200":
          description: OIDC redirect parameters.
          content: { application/json: { schema: { $ref: "#/components/schemas/OidcDiscoverResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /auth/oidc/callback:
    post:
      tags: [J1 · Auth & Dashboard]
      operationId: completeOidcCallback
      summary: Exchange OIDC authorization code, sync user_oidc_identities & open tracked session
      security: []
      x-required-permission: public
      x-rls-scope: NONE
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OidcCallbackRequest" } } }
      responses:
        "200":
          description: Authenticated session payload.
          content: { application/json: { schema: { $ref: "#/components/schemas/OidcCallbackResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/workspaces:
    get:
      tags: [J1 · Auth & Dashboard]
      operationId: listAccessibleWorkspaces
      summary: List tenants and roles available to the authenticated user for the Workspace Picker
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      responses:
        "200":
          description: Accessible workspaces.
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/WorkspaceSummary" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [J1 · Auth & Dashboard]
      operationId: logoutSession
      summary: Revoke current user_sessions record and return OIDC end-session redirect URL
      x-required-permission: authenticated
      x-rls-scope: USER_SELF
      responses:
        "200":
          description: Session revoked.
          content: { application/json: { schema: { type: object, required: [revoked, oidcEndSessionUrl], properties: { revoked: { type: boolean }, oidcEndSessionUrl: { type: ["string", "null"], format: uri } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dashboard/summary:
    get:
      tags: [J1 · Auth & Dashboard]
      operationId: getDashboardSummary
      summary: Fetch KPI summary cards, recent tenant usage, governance alerts & high-risk audit strip
      x-required-permission: dashboard:view
      x-rls-scope: TENANT_OR_SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - { name: windowDays, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Dashboard summary payload.
          content: { application/json: { schema: { $ref: "#/components/schemas/DashboardSummaryResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenants:
    get:
      tags: [J2 · Tenants & Organizations]
      operationId: listTenants
      summary: Search, filter, and paginate provisioned tenants with live seat/org utilization
      x-required-permission: tenants:view
      x-rls-scope: TENANT_OR_SUPER_ADMIN
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchParam"
        - { name: customerType, in: query, schema: { $ref: "#/components/schemas/CustomerType" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TenantStatus" } }
        - { name: moduleCode, in: query, schema: { type: string } }
      responses:
        "200":
          description: Paginated tenant directory.
          content: { application/json: { schema: { $ref: "#/components/schemas/TenantPageResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenants/slug-availability:
    get:
      tags: [J2 · Tenants & Organizations]
      operationId: checkTenantSlugAvailability
      summary: Check real-time availability of a workspace subdomain slug before onboarding
      x-required-permission: tenants:create
      x-rls-scope: SUPER_ADMIN
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", minLength: 3, maxLength: 100 } }
      responses:
        "200":
          description: Slug availability evaluation.
          content: { application/json: { schema: { type: object, required: [slug, available], properties: { slug: { type: string }, available: { type: boolean }, suggestedAlternative: { type: ["string", "null"] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenants/onboard:
    post:
      tags: [J2 · Tenants & Organizations]
      operationId: onboardTenant
      summary: Atomically execute 4-step Tenant Onboarding Wizard
      x-required-permission: tenants:create
      x-rls-scope: SUPER_ADMIN
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OnboardTenantRequest" } } }
      responses:
        "201":
          description: Provisioned tenant bundle.
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardTenantResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /tenants/{tenantId}:
    get:
      tags: [J2 · Tenants & Organizations]
      operationId: getTenantById
      summary: Get detailed tenant profile, quota utilization, and module summary
      x-required-permission: tenants:view
      x-rls-scope: TENANT
      parameters: [{ $ref: "#/components/parameters/TenantIdPath" }]
      responses:
        "200": { description: Tenant details., content: { application/json: { schema: { $ref: "#/components/schemas/TenantDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [J2 · Tenants & Organizations]
      operationId: updateTenant
      summary: Update tenant legal entity metadata, region, currency, or FY cycle
      x-required-permission: tenants:edit
      x-rls-scope: TENANT
      parameters: [{ $ref: "#/components/parameters/TenantIdPath" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateTenantRequest" } } }
      responses:
        "200": { description: Updated tenant., content: { application/json: { schema: { $ref: "#/components/schemas/TenantDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tenants/{tenantId}/suspend:
    post:
      tags: [J2 · Tenants & Organizations]
      operationId: suspendTenant
      summary: Suspend tenant with typed confirmation token & revoke active sessions
      x-required-permission: tenants:manage
      x-rls-scope: SUPER_ADMIN
      parameters: [{ $ref: "#/components/parameters/TenantIdPath" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SuspendTenantRequest" } } }
      responses:
        "200": { description: Tenant suspended., content: { application/json: { schema: { $ref: "#/components/schemas/TenantDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tenants/{tenantId}/reactivate:
    post:
      tags: [J2 · Tenants & Organizations]
      operationId: reactivateTenant
      summary: Restore a suspended tenant to ACTIVE status
      x-required-permission: tenants:manage
      x-rls-scope: SUPER_ADMIN
      parameters: [{ $ref: "#/components/parameters/TenantIdPath" }]
      responses:
        "200": { description: Tenant reactivated., content: { application/json: { schema: { $ref: "#/components/schemas/TenantDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /organizations/tree:
    get:
      tags: [J2 · Tenants & Organizations]
      operationId: getOrganizationTree
      summary: Retrieve RLS-isolated parent-subsidiary or CA Practice HQ-to-client organization hierarchy
      x-required-permission: organizations:view
      x-rls-scope: ORG_ISOLATED
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Organization tree.
          content:
            application/json:
              schema:
                type: object
                required: [tenantId, totalVisibleOrgs, roots]
                properties:
                  tenantId: { type: string, format: uuid }
                  totalVisibleOrgs: { type: integer }
                  roots: { type: array, items: { $ref: "#/components/schemas/OrganizationTreeNode" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /organizations:
    post:
      tags: [J2 · Tenants & Organizations]
      operationId: createOrganization
      summary: Provision a new subsidiary or CA client organization (enforces org_limit quota guard)
      x-required-permission: organizations:create
      x-rls-scope: TENANT_OWNER
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateOrganizationRequest" } } }
      responses:
        "201": { description: Organization created., content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /organizations/bulk-import:
    post:
      tags: [J2 · Tenants & Organizations]
      operationId: bulkImportOrganizations
      summary: Bulk-import CA Firm client organizations within remaining org_limit quota
      x-required-permission: organizations:create
      x-rls-scope: TENANT_OWNER
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BulkImportOrganizationsRequest" } } }
      responses:
        "201": { description: Bulk import completed., content: { application/json: { schema: { type: object, required: [createdCount, items], properties: { createdCount: { type: integer }, items: { type: array, items: { $ref: "#/components/schemas/OrganizationDetail" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
  /organizations/{orgId}:
    get:
      tags: [J2 · Tenants & Organizations]
      operationId: getOrganizationById
      summary: Get RLS-protected organization details, member count & enabled module badges
      x-required-permission: organizations:view
      x-rls-scope: ORG_ISOLATED
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/OrgIdPath" }]
      responses:
        "200": { description: Organization details., content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationDetail" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [J2 · Tenants & Organizations]
      operationId: updateOrganization
      summary: Update organization legal name, GSTIN/CIN tax identifiers, or status
      x-required-permission: organizations:edit
      x-rls-scope: ORG_ISOLATED
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/OrgIdPath" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" } } }
      responses:
        "200": { description: Organization updated., content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationDetail" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      tags: [J3 · Users & Invitations]
      operationId: listUsers
      summary: List tenant-scoped platform users with OIDC IdP, org counts, roles & status filters
      x-required-permission: users:view
      x-rls-scope: TENANT
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchParam"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/UserStatus" } }
      responses:
        "200": { description: Users directory., content: { application/json: { schema: { $ref: "#/components/schemas/UserPageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{userId}/suspend:
    post:
      tags: [J3 · Users & Invitations]
      operationId: suspendUser
      summary: Suspend user account and revoke all active OIDC sessions immediately
      x-required-permission: users:edit
      x-rls-scope: TENANT_OWNER
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/UserIdPath" }]
      responses:
        "200": { description: User suspended., content: { application/json: { schema: { $ref: "#/components/schemas/UserSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{userId}/sessions/revoke:
    post:
      tags: [J3 · Users & Invitations]
      operationId: revokeUserSessions
      summary: Force logout across all active sessions for the specified user
      x-required-permission: users:edit
      x-rls-scope: TENANT_OWNER
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/UserIdPath" }]
      responses:
        "200": { description: Sessions revoked., content: { application/json: { schema: { type: object, required: [userId, revokedSessionCount], properties: { userId: { type: string, format: uuid }, revokedSessionCount: { type: integer } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations:
    get:
      tags: [J3 · Users & Invitations]
      operationId: listInvitations
      summary: List pending and historical user invitations
      x-required-permission: users:view
      x-rls-scope: TENANT
      parameters:
        - $ref: "#/components/parameters/TenantIdHeader"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InvitationStatus" } }
      responses:
        "200": { description: Invitations list., content: { application/json: { schema: { $ref: "#/components/schemas/InvitationPageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
