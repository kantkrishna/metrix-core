      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateNotificationRuleRequest" } } }
      responses:
        "200": { description: Updated rule., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationRoutingRule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
