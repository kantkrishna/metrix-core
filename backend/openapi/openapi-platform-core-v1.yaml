      responses:
        "202": { description: Queued., content: { application/json: { schema: { type: object, required: [deliveryId, bullmqJobId, status], properties: { deliveryId: { type: string, format: uuid }, bullmqJobId: { type: string }, status: { $ref: "#/components/schemas/DeliveryStatus" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/deliveries:
    get:
      tags: [J10 · Notifications]
